<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#322d29">
  <meta name="description" content="A browser shooter with hand-drawn art. Clear the sky before the invaders reach you.">
  <title>Space Invaders</title>
  <link rel="icon" href="assets/img/ship.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main>
    <section id="menu" class="screen menu">
      <div class="corner">
        <button class="icon-btn sound-toggle" data-action="sound" aria-label="Sound" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path class="on" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"/><path class="off" d="M16 9.5l5 5m0-5l-5 5"/></svg>
        </button>
      </div>
      <div class="menu-main">
        <h1><img class="title" src="assets/img/space.png" alt="Space Invaders"></h1>
        <button class="img-btn img-btn-large" data-action="start">
          <img src="assets/img/start.png" alt="Start">
        </button>
      </div>
      <div class="menu-side">
        <div class="stats">
          <h2>Personal best</h2>
          <p class="stats-best" id="menu-best">0</p>
          <p class="stats-last" id="menu-last">No games yet</p>
        </div>
        <div class="help">
          <h2>Controls</h2>
          <dl class="controls">
            <dt><kbd>A</kbd> <kbd>D</kbd> / <kbd>←</kbd> <kbd>→</kbd></dt><dd>Move</dd>
            <dt><kbd>Space</kbd></dt><dd>Shoot</dd>
            <dt><kbd>P</kbd> / <kbd>Esc</kbd></dt><dd>Pause</dd>
            <dt><kbd>M</kbd></dt><dd>Sound on/off</dd>
            <dt><kbd>Enter</kbd></dt><dd>Start</dd>
          </dl>
        </div>
      </div>
    </section>

    <section id="game" class="screen game" hidden>
      <div class="hud">
        <span>Score <b id="hud-score">0</b></span>
        <span>Enemies <b id="hud-left">0</b></span>
        <span>Best <b id="hud-best">0</b></span>
        <div class="hud-buttons">
          <button class="icon-btn sound-toggle" data-action="sound" aria-label="Sound" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path class="on" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"/><path class="off" d="M16 9.5l5 5m0-5l-5 5"/></svg>
          </button>
          <button class="icon-btn" data-action="pause" aria-label="Pause">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          </button>
        </div>
      </div>
      <div class="viewport">
        <canvas aria-label="Game"></canvas>
        <div class="pause" id="pause" hidden>
          <h2>Paused</h2>
          <button class="btn" data-action="resume">Resume</button>
          <button class="btn" data-action="start">Restart</button>
          <button class="img-btn" data-action="menu"><img src="assets/img/quit.png" alt="Quit"></button>
        </div>
      </div>
    </section>

    <section id="win" class="screen end end-win" hidden>
      <img class="end-art" src="assets/img/win.jpg" alt="Space is saved!">
      <p class="end-score">Score <b data-final-score>0</b></p>
      <p class="end-detail" data-detail></p>
      <div class="end-actions">
        <button class="btn" data-action="start">Play again</button>
        <button class="img-btn" data-action="menu"><img src="assets/img/mmtwo.png" alt="Main menu"></button>
      </div>
    </section>

    <section id="lose" class="screen end end-lose" hidden>
      <img class="end-art" src="assets/img/lose.jpg" alt="Space is no more!">
      <p class="end-score">Score <b data-final-score>0</b></p>
      <p class="end-detail" data-detail></p>
      <div class="end-actions">
        <button class="btn btn-dark" data-action="start">Try again</button>
        <button class="img-btn" data-action="menu"><img src="assets/img/mmone.png" alt="Main menu"></button>
      </div>
    </section>
  </main>
</body>
</html>
